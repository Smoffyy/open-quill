name: Version guard

on:
  pull_request:
    branches: [stable]

jobs:
  version-bumped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fail if package.json version is not newer than stable
        run: |
          BASE_VERSION=$(git show "origin/${{ github.base_ref }}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "0.0.0")
          node check-version-bump.mjs "$BASE_VERSION" "${{ github.base_ref }}"

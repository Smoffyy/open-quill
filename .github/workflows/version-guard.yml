name: Version guard

# Merging into stable is what drafts a release, so a merge that forgot to bump the
# version publishes nothing and looks like the release workflow broke. This catches
# that at the PR, which is where it can still be fixed cheaply.

on:
  pull_request:
    branches: [stable]

permissions:
  contents: read

concurrency:
  group: version-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-bumped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fail if package.json version is not newer than stable
        run: |
          BASE=$(git show "origin/${{ github.base_ref }}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "0.0.0")
          HEAD=$(node -p "require('./package.json').version")
          echo "base=$BASE head=$HEAD"

          # Bare versions only, which is also what makes the sort below trustworthy:
          case "$HEAD" in
            *-*)
              echo "::error::package.json version $HEAD has a prerelease tail. ${{ github.base_ref }} carries bare versions only, like ${HEAD%%-*}."
              exit 1
              ;;
          esac

          if [ "$BASE" = "$HEAD" ]; then
            echo "::error::package.json version ($HEAD) must be bumped before merging into ${{ github.base_ref }}, or the merge drafts nothing."
            exit 1
          fi

          NEWEST=$(printf '%s\n%s\n' "$BASE" "$HEAD" | sort -V | tail -n1)
          if [ "$NEWEST" != "$HEAD" ]; then
            echo "::error::package.json version $HEAD is older than $BASE on ${{ github.base_ref }}."
            exit 1
          fi

          echo "version-guard: OK, $HEAD is newer than $BASE."

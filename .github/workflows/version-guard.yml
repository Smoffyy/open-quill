name: Version guard

on:
  pull_request:
    branches: [beta, stable]

jobs:
  version-bumped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if package.json version was not bumped
        run: |
          BASE_VERSION=$(git show "origin/${{ github.base_ref }}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "0.0.0")
          HEAD_VERSION=$(node -p "require('./package.json').version")
          echo "base=$BASE_VERSION head=$HEAD_VERSION"
          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "::error::package.json version ($HEAD_VERSION) must be bumped before merging into ${{ github.base_ref }}."
            exit 1
          fi

      - name: Fail if head version is not newer than base
        run: |
          BASE_VERSION=$(git show "origin/${{ github.base_ref }}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "0.0.0")
          HEAD_VERSION=$(node -p "require('./package.json').version")
          NEWEST=$(printf '%s\n%s\n' "$BASE_VERSION" "$HEAD_VERSION" | sort -V | tail -1)
          if [ "$NEWEST" != "$HEAD_VERSION" ]; then
            echo "::error::Head version $HEAD_VERSION is older than base version $BASE_VERSION."
            exit 1
          fi

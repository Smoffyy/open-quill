name: Pre-release

on:
  push:
    tags:
      - '*-beta.*'

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Verify tag matches package.json version exactly
        run: |
          TAG="$GITHUB_REF_NAME"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::Tag $TAG does not match package.json version $PKG. Bump package.json and re-tag, or the app will report the wrong build."; exit 1; }

      - name: Verify the tag is on dev
        run: |
          if ! git branch -r --contains "$GITHUB_SHA" | grep -qE '^\s*origin/(dev|stable)$'; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is on neither dev nor stable. Push the branch first."
            exit 1
          fi

      - name: Release metadata is present and shippable
        run: npm run check:release

      - name: Install dependencies
        run: npm run install:all

      - name: Build client
        run: npm run build

      - name: Bundle release archive
        run: |
          mkdir -p out
          zip -r "out/open-quill-${GITHUB_REF_NAME}.zip" \
            package.json package-lock.json README.md LICENSE CREDITS.md CLAUDE.md \
            server client/dist \
            -x "server/node_modules/*" "server/data/*"

      - name: Derive release name
        id: name
        run: |
          TAG="$GITHUB_REF_NAME"
          BASE="${TAG%%-*}"
          SUFFIX="${TAG#*-}"
          KIND="${SUFFIX%%.*}"
          NUM="${SUFFIX##*.}"
          KIND="$(echo "${KIND:0:1}" | tr '[:lower:]' '[:upper:]')${KIND:1}"
          echo "release_name=$BASE $KIND $NUM" >> "$GITHUB_OUTPUT"

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.name.outputs.release_name }}
          prerelease: true
          draft: true
          generate_release_notes: true
          files: out/*.zip

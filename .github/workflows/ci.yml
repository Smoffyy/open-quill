name: CI

on:
  push:
    branches: [dev, beta, stable]
  pull_request:
    branches: [dev, beta, stable]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Syntax check server
        run: |
          cd server
          find . -name node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build client
        run: npm run build

      - name: Smoke test server
        run: |
          node server/index.js &
          SERVER_PID=$!
          sleep 4
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/)
          echo "GET / -> $STATUS"
          API=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"email":"ci@test.dev"}' http://localhost:3001/api/auth/check-email)
          echo "POST /api/auth/check-email -> $API"
          kill $SERVER_PID
          [ "$STATUS" = "200" ] && [ "$API" = "200" ]

      - name: Server tests
        run: cd server && npm test

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::Tag v$TAG does not match package.json version $PKG"; exit 1; }

      - name: Install dependencies
        run: npm run install:all

      - name: Build client
        run: npm run build

      - name: Smoke test server
        run: |
          node server/index.js &
          SERVER_PID=$!
          sleep 4
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/)
          kill $SERVER_PID
          [ "$STATUS" = "200" ]

      - name: Bundle release archive
        run: |
          mkdir -p out
          zip -r "out/open-quill-${GITHUB_REF_NAME}.zip" \
            package.json package-lock.json README.md LICENSE CREDITS.md CLAUDE.md \
            server client/dist \
            -x "server/node_modules/*" "server/data/*"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: out/*.zip

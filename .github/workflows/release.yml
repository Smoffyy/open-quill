name: Release

# Tags are the version string exactly, with no "v" prefix: 27.1.0.
# A tail like -beta.3 belongs to Pre-release and must not match here.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Verify tag matches package.json version
        run: |
          TAG="$GITHUB_REF_NAME"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::Tag $TAG does not match package.json version $PKG"; exit 1; }

      - name: Verify the tag is on stable
        run: |
          if ! git branch -r --contains "$GITHUB_SHA" | grep -qE '^\s*origin/stable$'; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on stable. A release is what merging to stable means: merge first, then tag."
            exit 1
          fi

      - name: Release metadata is present and shippable
        run: npm run check:release

      - name: Install dependencies
        run: npm run install:all

      - name: Build client
        run: npm run build

      # Polls rather than sleeping a fixed four seconds, so a slow runner does not
      # read as a failure and a genuinely dead server fails in one second, not four.
      - name: Smoke test server
        run: |
          node server/index.js &
          SERVER_PID=$!
          STATUS=""
          for _ in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/ || true)
            [ "$STATUS" = "200" ] && break
            sleep 1
          done
          kill $SERVER_PID 2>/dev/null || true
          [ "$STATUS" = "200" ] || { echo "::error::server did not answer 200 on / (last status: ${STATUS:-none})"; exit 1; }

      - name: Bundle release archive
        run: |
          mkdir -p out
          zip -r "out/open-quill-${GITHUB_REF_NAME}.zip" \
            package.json package-lock.json README.md LICENSE CREDITS.md CLAUDE.md \
            server client/dist \
            -x "server/node_modules/*" "server/data/*"

      # Named for the tag verbatim: one canonical version string everywhere.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: out/*.zip

      - name: Clean up
        if: always()
        run: rm -rf server/data

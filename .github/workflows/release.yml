name: Release

on:
  push:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this commit is a release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package.json=$VERSION"

          case "$VERSION" in
            *-*)
              echo "::error::package.json version $VERSION has a prerelease tail. stable carries bare versions only, like ${VERSION%%-*}."
              exit 1
              ;;
          esac

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $VERSION already exists, so there is nothing to draft. Bump the version on dev before the next merge."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Release metadata is present and shippable
        run: npm run check:release -- --final

      - name: Install dependencies
        run: npm run install:all

      - name: Build client
        run: npm run build

      - name: Smoke test server
        run: |
          node server/index.js &
          SERVER_PID=$!
          STATUS=""
          for _ in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/ || true)
            [ "$STATUS" = "200" ] && break
            sleep 1
          done
          kill $SERVER_PID 2>/dev/null || true
          [ "$STATUS" = "200" ] || { echo "::error::server did not answer 200 on / (last status: ${STATUS:-none})"; exit 1; }

      - name: Bundle release archive
        run: |
          mkdir -p out
          zip -r "out/open-quill-${VERSION}.zip" \
            package.json package-lock.json README.md LICENSE CREDITS.md AGENTS.md \
            server client/dist \
            -x "server/node_modules/*" "server/data/*"

      - name: Draft the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: out/*.zip

      - name: Clean up
        if: always()
        run: rm -rf server/data

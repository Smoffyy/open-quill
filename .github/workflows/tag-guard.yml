name: Tag guard

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  reject:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a v-prefixed tag
        run: |
          TAG="$GITHUB_REF_NAME"
          BARE="${TAG#v}"
          echo "::error::Tag $TAG has a \"v\" prefix. Tags are the version string exactly, with no prefix."
          cat <<EOF

          Open Quill tags are bare version strings: 27.0.0.

          You should not need to tag by hand at all. Releases are drafted by the
          Release workflow when dev is merged into stable, and publishing that draft
          is what creates the tag.

          To remove this one:

            git tag -d "$TAG"
            git push origin ":refs/tags/$TAG"

          EOF
          exit 1

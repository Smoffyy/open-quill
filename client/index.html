<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>open-quill</title>
    <meta name="description" content="A self-hosted chat interface for local and remote language models." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1f1f1e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f3ee" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="open-quill" />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="open-quill" />
    <meta property="og:title" content="open-quill" />
    <meta property="og:description" content="A self-hosted chat interface for local and remote language models." />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Open Quill: self-hosted chat for local and cloud models" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="open-quill" />
    <meta name="twitter:description" content="A self-hosted chat interface for local and remote language models." />
    <meta name="twitter:image" content="/brand/og-image.png" />
    <link rel="icon" href="/brand/favicon.ico" sizes="32x32" />
    <link rel="icon" id="favicon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        var OQ = __OQ_BOOT__;
        var root = document.documentElement;
        var preset = OQ.preset;
        var pal = null;
        try {
          var stored = localStorage.getItem('oq-preset');
          if (OQ.presets[stored]) preset = stored;
          pal = OQ.palettes[localStorage.getItem('oq-palette')] || null;
        } catch (e) {}
        var p = OQ.presets[preset];
        if (pal && pal.preset !== preset) pal = OQ.palettes[pal.mode === 'light' ? p.light : p.dark];
        if (!pal) {
          var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          pal = OQ.palettes[light ? p.light : p.dark];
        }
        root.setAttribute('data-preset', preset);
        root.setAttribute('data-layout', p.layout);
        root.setAttribute('data-theme', pal.mode);
        root.setAttribute('data-palette', pal.chain);
        root.style.background = pal.bg;
        var meta = document.querySelector('meta[name="theme-color"]:not([media])');
        if (!meta) { meta = document.createElement('meta'); meta.setAttribute('name', 'theme-color'); document.head.appendChild(meta); }
        meta.setAttribute('content', pal.bg);
        var fav = document.getElementById('favicon');
        if (fav) fav.setAttribute('href', pal.mode === 'light' ? '/brand/favicon-light.svg' : '/brand/favicon-dark.svg');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
